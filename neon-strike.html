<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Strike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050814;overflow:hidden;font-family:system-ui,sans-serif;cursor:none}
canvas{display:block}
#hud{position:fixed;top:16px;left:16px;color:#7df9ff;font-size:14px;letter-spacing:1px;pointer-events:none;text-shadow:0 0 8px #7df9ff}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;pointer-events:none}
#title h1{font-size:72px;letter-spacing:6px;background:linear-gradient(90deg,#ff4d6d,#7df9ff,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
#title p{margin-top:12px;color:#9aa;letter-spacing:2px}
#diff{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5}
#diff h2{color:#7df9ff;font-size:32px;letter-spacing:4px}
#diff button{padding:14px 40px;font-size:18px;border:none;border-radius:8px;cursor:pointer;font-weight:700;letter-spacing:2px;color:#fff}
#diff .easy{background:linear-gradient(90deg,#2ecc71,#27ae60)}
#diff .med{background:linear-gradient(90deg,#f39c12,#e67e22)}
#diff .hard{background:linear-gradient(90deg,#e74c3c,#c0392b)}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;pointer-events:none}
#over h2{font-size:64px;color:#ff4d6d;text-shadow:0 0 20px #ff4d6d}
#over p{margin-top:12px;font-size:20px;color:#9aa}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="title" style="display:none"><h1>NEON STRIKE</h1><p>WASD move • Mouse aim • Click fire</p></div>
<div id="diff"><h2>SELECT DIFFICULTY</h2><button class="easy" onclick="startGame('easy')">EASY</button><button class="med" onclick="startGame('med')">MEDIUM</button><button class="hard" onclick="startGame('hard')">HARD</button></div>
<div id="over"><h2>GAME OVER</h2><p id="final"></p><p style="margin-top:20px;color:#7df9ff">Click to restart</p></div>
<div id="pause" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:20;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:12px"><h2 style="color:#7df9ff">PAUSED</h2><button onclick="changeDiff('easy')" style="padding:10px 30px;border:none;border-radius:6px;background:#2ecc71;color:#fff;font-weight:700;cursor:pointer">Easy</button><button onclick="changeDiff('med')" style="padding:10px 30px;border:none;border-radius:6px;background:#f39c12;color:#fff;font-weight:700;cursor:pointer">Medium</button><button onclick="changeDiff('hard')" style="padding:10px 30px;border:none;border-radius:6px;background:#e74c3c;color:#fff;font-weight:700;cursor:pointer">Hard</button><button onclick="quitToMenu()" style="padding:10px 30px;border:none;border-radius:6px;background:#555;color:#fff;font-weight:700;cursor:pointer">Quit to Menu</button></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}resize();addEventListener('resize',resize);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='p'||e.key==='Escape'){if(state==='play'){paused=!paused;document.getElementById('pause').style.display=paused?'flex':'none'}}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let mouse={x:W/2,y:H/2},mouseDown=false;addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',()=>{mouseDown=true});addEventListener('mouseup',()=>{mouseDown=false});
let state='diff',score=0,hp=100,level=1,diff='med',paused=false;
let player={x:0,y:0,r:16,speed:420,vx:0,vy:0,cooldown:0,inv:0};
let bullets=[],enemies=[],particles=[],stars=[],blooms=[];
for(let i=0;i<160;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+0.5});
for(let i=0;i<40;i++)blooms.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*4,a:Math.random()*Math.PI*2});
function diffParams(){if(diff==='easy')return{enemyHp:1,enemySpeed:50,spawn:1.4,dmg:10};if(diff==='hard')return{enemyHp:3,enemySpeed:110,spawn:0.5,dmg:5};return{enemyHp:2,enemySpeed:75,spawn:0.9,dmg:15}}
function changeDiff(d){diff=d;paused=false;document.getElementById('pause').style.display='none';reset()}
function quitToMenu(){paused=false;document.getElementById('pause').style.display='none';state='diff';document.getElementById('diff').style.display='flex';document.getElementById('over').style.display='none'}
function startGame(d){diff=d;const p=diffParams();document.getElementById('diff').style.display='none';document.getElementById('title').style.display='flex';reset()}
function reset(){score=0;hp=100;level=1;player.x=W/2;player.y=H/2;player.vx=0;player.vy=0;bullets=[];enemies=[];particles=[];state='play';paused=false;document.getElementById('title').style.display='none';document.getElementById('over').style.display='none';document.getElementById('pause').style.display='none'}
addEventListener('mousedown',()=>{if(state==='over'){document.getElementById('diff').style.display='flex';state='diff'}else if(state==='play'){shoot()}});
function shoot(){if(player.cooldown>0)return;const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*850,vy:Math.sin(a)*850,life:1.2});player.cooldown=diff==='hard'?0.05:diff==='easy'?0.15:0.1}
function spawnEnemy(){const side=Math.floor(Math.random()*4);let x,y;if(side===0){x=Math.random()*W;y=-40}else if(side===1){x=W+40;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+40}else{x=-40;y=Math.random()*H}const dp=diffParams();const hp=dp.enemyHp+Math.floor(level/4);enemies.push({x,y,r:14+Math.random()*6,hp,maxhp:hp,speed:dp.enemySpeed+level*6+Math.random()*20})}
let spawnTimer=0;
function addParticles(x,y,color,n=14){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*200;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.7+Math.random()*0.4,color})}}
let last=performance.now();
function update(dt){
if(state!=='play'||paused)return;
if(diff==='hard'&&mouseDown)shoot();
let mx=0,my=0;if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;
const len=Math.hypot(mx,my)||1;player.vx=mx/len*player.speed;player.vy=my/len*player.speed;
player.x=Math.max(player.r,Math.min(W-player.r,player.x+player.vx*dt));
player.y=Math.max(player.r,Math.min(H-player.r,player.y+player.vy*dt));
player.cooldown=Math.max(0,player.cooldown-dt);
player.inv=Math.max(0,player.inv-dt);
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}bullets=bullets.filter(b=>b.life>0&&b.x>-50&&b.x<W+50&&b.y>-50&&b.y<H+50);
const dp=diffParams();
for(const e of enemies){const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}
for(const b of bullets){for(const e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){e.hp--;b.life=0;addParticles(b.x,b.y,'#ffd166',8);if(e.hp<=0){score+=10+level*2;addParticles(e.x,e.y,'#ff4d6d',24);e.dead=true}}}}
enemies=enemies.filter(e=>!e.dead);
for(const e of enemies){if(player.inv<=0&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){hp-=dp.dmg;player.inv=0.8;addParticles(player.x,player.y,'#7df9ff',18);e.dead=true}}
enemies=enemies.filter(e=>!e.dead);
if(hp<=0){hp=0;state='over';document.getElementById('over').style.display='flex';document.getElementById('final').textContent=`Score ${score} • Level ${level} • ${diff.toUpperCase()}`;return}
spawnTimer-=dt;const rate=Math.max(0.25,dp.spawn-level*0.05);if(spawnTimer<=0){spawnEnemy();spawnTimer=rate}
if(score>=level*200){level++;spawnTimer=0}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9;p.life-=dt}particles=particles.filter(p=>p.life>0);
for(const s of stars){s.y+=s.z*50*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}
for(const bl of blooms){bl.a+=dt*0.8}
}
function draw(){
// background gradient
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0f2a');g.addColorStop(1,'#050814');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// stars
for(const s of stars){ctx.fillStyle=`rgba(125,249,255,${0.4+s.z*0.4})`;ctx.shadowColor='#7df9ff';ctx.shadowBlur=6;ctx.fillRect(s.x,s.y,s.z*1.5,s.z*1.5)}ctx.shadowBlur=0;
// blooms
for(const bl of blooms){ctx.globalAlpha=0.08;ctx.fillStyle='#7df9ff';ctx.beginPath();ctx.arc(bl.x,bl.y,bl.r+Math.sin(bl.a)*2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
// particles
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
// bullets
ctx.shadowColor='#ffd166';ctx.shadowBlur=16;ctx.fillStyle='#ffd166';for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill()}
// enemies
ctx.shadowColor='#ff4d6d';ctx.shadowBlur=20;for(const e of enemies){const grad=ctx.createRadialGradient(e.x,e.y,2,e.x,e.y,e.r);grad.addColorStop(0,'#ff9ab0');grad.addColorStop(0.6,'#ff4d6d');grad.addColorStop(1,'#7a1030');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();if(e.maxhp>1){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,-Math.PI/2,-Math.PI/2+Math.PI*2*(e.hp/e.maxhp));ctx.stroke()}}
// player
ctx.shadowColor='#7df9ff';ctx.shadowBlur=28;const pg=ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,player.r);pg.addColorStop(0,'#fff');pg.addColorStop(0.3,'#7df9ff');pg.addColorStop(1,'#0066ff');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
// aim line
ctx.shadowBlur=0;ctx.strokeStyle='rgba(125,249,255,0.3)';ctx.lineWidth=1.5;ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();ctx.setLineDash([]);
// crosshair
ctx.strokeStyle='#7df9ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(mouse.x,mouse.y,12,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(mouse.x-18,mouse.y);ctx.lineTo(mouse.x-7,mouse.y);ctx.moveTo(mouse.x+7,mouse.y);ctx.lineTo(mouse.x+18,mouse.y);ctx.moveTo(mouse.x,mouse.y-18);ctx.lineTo(mouse.x,mouse.y-7);ctx.moveTo(mouse.x,mouse.y+7);ctx.lineTo(mouse.x,mouse.y+18);ctx.stroke();
ctx.shadowBlur=0;
document.getElementById('hud').innerHTML=`SCORE ${score} &nbsp; HP ${hp} &nbsp; LVL ${level} &nbsp; ENEMIES ${enemies.length} &nbsp; ${diff.toUpperCase()}`;
}
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
